name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Builds dist/fleetbar.js + dist/fleetbar.mjs, then runs node --test.
      - run: pnpm test
      - name: Pack dry run (the files npm would ship)
        if: matrix.node == '24'
        run: npm pack --dry-run
